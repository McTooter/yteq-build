name: Build YTEQ
on:
  workflow_dispatch:
  push:
    paths:
      - 'YTEQ/**'
      - 'Makefile'
      - 'control'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos + SDKs (official installer)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          brew install ldid xz dpkg 2>/dev/null || true
          ls -d ~/theos 2>/dev/null || ls -d $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos 2>/dev/null || true
          ls $THEOS/sdks || true
          make package FINALPACKAGE=1
      - name: Extract dylib
        run: |
          ls -R .theos packages || true
          # Theos lays out tweak dylib at .theos/obj/iphone/.../YTEQ.dylib
          find .theos -name "YTEQ.dylib" -exec cp {} ./YTEQ.dylib \;
          # minimal substrate plist for Sideloadly / ElleKit
          echo -e "{ Filter = { Bundles = ( \"com.google.ios.youtube\" ); }; }" > YTEQ.plist
          ls -lh YTEQ.*
      - uses: actions/upload-artifact@v4
        with:
          name: YTEQ-sideloadly
          path: |
            YTEQ.dylib
            YTEQ.plist
